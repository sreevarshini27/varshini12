<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Login</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f6f9;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .login-box{
        width:350px;
        background:#fff;
        padding:30px;
        border-radius:12px;
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
        text-align:center;
    }

    .logo{
        width:100px;
        height:100px;
        object-fit:contain;
        margin-bottom:15px;
    }

    h2{
        margin-bottom:20px;
        color:#003366;
    }

    input{
        width:100%;
        padding:12px;
        margin:10px 0;
        border:1px solid #ccc;
        border-radius:6px;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:6px;
        background:#003366;
        color:white;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#0055aa;
    }

    .footer{
        margin-top:15px;
        font-size:12px;
        color:gray;
    }
</style>
</head>
<body>

<div class="login-box">

    <!-- Replace with your college logo -->
    <img src="kprcaslogo.png" alt="College Logo" class="logo">

    <h2>Student Login</h2>

    <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <div class="footer">
        © 2026 College Portal
    </div>

</div>

</body>
</html>
